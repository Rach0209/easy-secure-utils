name: Release

# v1.2.3 처럼 v 로 시작하는 태그를 push 하면 GitHub Release 를 만들고 배포 파일을 첨부합니다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo
            echo '### 무결성 (SRI)'
            echo '```json'
            cat dist/integrity.json
            echo '```'
          } >> release-notes.md

      - name: Package release assets
        run: |
          mkdir release-assets
          cp dist/easy-secure-utils.js dist/easy-secure-utils.mjs dist/integrity.json release-assets/
          zip -r "release-assets/easy-secure-utils-${GITHUB_REF_NAME}.zip" dist types README.md LICENSE CHANGELOG.md SECURITY.md package.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
