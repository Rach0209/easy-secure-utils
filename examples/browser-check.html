<!DOCTYPE html>
<html lang="ko">
<head>

  <title>브라우저 호환성 점검 — easy-secure-utils</title>
  <style>

    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #586069; margin: 0 0 16px; font-size: 14px; }
    .summary { padding: 14px 16px; border-radius: 8px; font-size: 17px; font-weight: 600; margin-bottom: 16px; background: #fff8c5; border: 1px solid #d4a72c; }

    .summary.fail { background: #ffebe9; border-color: #cf222e; color: #82071e; }

    .card h2 { font-size: 15px; margin: 0 0 8px; }
    pre, textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
    textarea { width: 100%; box-sizing: border-box; height: 160px; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; background: #f1f3f5; padding: 6px 8px; border-top: 1px solid #e1e4e8; }
    td { padding: 5px 8px; border-top: 1px solid #f0f0f0; vertical-align: top; }
    td.detail { color: #82071e; font-size: 12px; word-break: break-all; }
    tr.fail td:first-child { font-weight: 600; }
    tr.skip td { color: #6a737d; }

  <script src="../dist/easy-secure-utils.js?v=1.1.0" defer></script>
